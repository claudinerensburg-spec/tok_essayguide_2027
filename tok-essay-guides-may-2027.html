var RUB='<div class="scroll"><table class="rub"><caption>Does the student provide a clear, coherent and critical exploration of the essay title?</caption><tr><th>Excellent<br>9–10</th><th>Good<br>7–8</th><th>Satisfactory<br>5–6</th><th>Basic<br>3–4</th><th>Rudimentary<br>1–2</th><th>0</th></tr><tr><td>The discussion has a sustained focus on the title and is linked effectively to areas of knowledge.</td><td>The discussion is focused on the title and is linked effectively to areas of knowledge.</td><td>The discussion is focused on the title and is developed with some links to areas of knowledge.</td><td>The discussion is connected to the title and makes superficial or limited links to areas of knowledge.</td><td>The discussion is weakly connected to the title.</td><td>The discussion does not reach the standard described by the other levels or is not a response to one of the prescribed titles for the correct examination session.</td></tr><tr><td>Arguments are clear, coherent and effectively supported by specific examples. The implications of arguments are considered.</td><td>Arguments are clear, coherent and supported by examples.</td><td>Arguments are offered and are supported by examples.</td><td>The discussion is largely descriptive.</td><td>While there may be links to the areas of knowledge, any relevant points are descriptive or consist only of unsupported assertions.</td><td></td></tr><tr><td>There is clear awareness and evaluation of different points of view.</td><td>There is awareness and some evaluation of different points of view.</td><td>There is some awareness of different points of view.</td><td>Limited arguments are offered but they are unclear and are not supported by effective examples.</td><td></td><td></td></tr><tr class="band"><td colspan="6">Possible characteristics</td></tr><tr class="chr"><td>Insightful</td><td>Pertinent</td><td>Acceptable</td><td>Underdeveloped</td><td>Ineffective</td><td></td></tr><tr class="chr"><td>Convincing</td><td>Relevant</td><td>Mainstream</td><td>Basic</td><td>Descriptive</td><td></td></tr><tr class="chr"><td>Accomplished</td><td>Analytical</td><td>Adequate</td><td>Superficial</td><td>Incoherent</td><td></td></tr><tr class="chr"><td>Lucid</td><td>Organized</td><td>Competent</td><td>Limited</td><td>Formless</td><td></td></tr></table></div>';

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function $(id){return document.getElementById(id)}
function sec(id,title,hue,body){return'<section id="'+id+'" style="--s:var('+hue+')"><h2>'+title+'</h2>'+body+'</section>'}
function starters(a){return'<div class="starters"><b>Sentence starters</b><ul>'+a.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+"</ul></div>"}
function role(c,chip,txt,w){return'<div class="role s-'+c+'"><span class="chip">'+chip+"</span><p>"+txt+(w?" <em>About "+w+" words.</em>":"")+"</p></div>"}
function rc(h,w,s,roles,st,extra){return'<div class="card" style="--s:var('+s+')"><div class="para-head"><h3>'+h+'</h3><span class="words">about '+w+' words</span></div><div class="recipe">'+roles.join("")+"</div>"+(st?starters(st):"")+(extra||"")+"</div>"}

function paras(p){
  var h=p.par,o="";
  o+='<p class="lead">Each recipe lists the parts in order. A part can be one sentence or several. Hit every part and you cover the three strands of the rubric.</p>';
  o+=rc("Introduction",150,"--r-claim",[
    role("claim","Interpret","Define the key terms you will use: "+h.defs+". Keep the meanings steady.",40),
    role("exp","Argue","State your line of argument in one or two sentences. Take a position on "+h.stance+".",50),
    role("ex","Map","Name your two areas and say what each will show, so the reader knows the route.",40)],h.ci);
  o+=rc("Claim paragraph (use once for each area)",300,"--r-ex",[
    role("claim","Claim","One sentence that answers the title for this area. "+h.claimHint,30),
    role("ex","Example","One specific real-life case: names, dates, what was done or found.",70),
    role("exp","Explain",h.explainHint,100),
    role("link","Link",h.linkHint,40),
    role("imp","Implication","Say what follows from your point. If it holds only under certain conditions, name them.",60)],h.cs);
  o+=rc("Counterclaim paragraph (use once for each area)",300,"--r-ctr",[
    role("ctr","Challenge","A serious opposing view for this area. "+h.counterHint,30),
    role("ex","Example","A second real case from the same area that supports the challenge.",70),
    role("exp","Evaluate","Decide what the challenge does to your claim. Does your explanation survive, need a qualification, or need to be rejected? Give a reason.",120),
    role("int","Mini-conclusion","One or two sentences: what you now conclude about the title for this area. Include any implication.",80)],h.cc);
  o+=rc("Conclusion",250,"--r-imp",[
    role("claim","Answer","Answer the title directly in one or two sentences.",40),
    role("exp","Draw together","Say what the two areas show together. Compare what happened in each.",90),
    role("imp","Implication","State a consequence of your answer.",60),
    role("link","Why it matters","Close by saying why the question matters or where the inquiry could go next.",60)],h.co,'<p class="lead">Do not bring in new examples here. Draw conclusions from the ones you have already analysed.</p>');
  return o;
}

function mapBar(p){
  var a=p.ar,k=p.ak;
  return'<p class="lead">The structure: introduction, first area of knowledge, second area of knowledge, conclusion. Each area gets two paragraphs, a claim and a counterclaim, each with a real-life example. The word split adds up to 1,600.</p><div class="bar" role="list">'
  +'<div role="listitem" class="s-claim" style="--w:150;--min:110px">Introduction<small>about 150</small></div>'
  +'<div role="listitem" class="k-'+k[0]+'" style="--w:300;--min:130px">'+esc(a[0])+": claim<small>about 300</small></div>"
  +'<div role="listitem" class="k-'+k[0]+'" style="--w:300;--min:130px">'+esc(a[0])+": counterclaim<small>about 300</small></div>"
  +'<div role="listitem" class="k-'+k[1]+'" style="--w:300;--min:130px">'+esc(a[1])+": claim<small>about 300</small></div>"
  +'<div role="listitem" class="k-'+k[1]+'" style="--w:300;--min:130px">'+esc(a[1])+": counterclaim<small>about 300</small></div>"
  +'<div role="listitem" class="s-imp" style="--w:250;--min:120px">Conclusion<small>about 250</small></div></div>'
  +'<p class="lead">Colours here only separate the blocks. Stay at or under 1,600 words in total, and ask your teacher how references and in-text citations are counted.</p>';
}

function cards(a){return'<div class="grid">'+a.map(function(c){return'<div class="card tint s-'+c[2]+'"><h3>'+c[0]+"</h3><p>"+c[1]+"</p></div>"}).join("")+"</div>"}
function pairsHtml(p){return'<p class="lead">'+(p.id==="p1"?"The arts and history are fixed, so use this table to choose the contrasts that give you the most to say.":"Choose a pair that lets you compare how the idea works through different routes. Pairing areas where the mechanism differs gives you something to evaluate.")+'</p><div class="scroll"><table><tr><th>Pairing</th><th>What you can compare</th><th>Cases to start with</th></tr>'+p.pairs.map(function(r){return"<tr><td>"+r[0]+"</td><td>"+r[1]+"</td><td>"+r[2]+"</td></tr>"}).join("")+"</table></div>"}
function trapsHtml(p){return'<div class="grid">'+p.traps.map(function(t){return'<div class="trap"><b>'+t[0]+"</b> "+t[1]+"</div>"}).join("")+"</div>"}
function rubricHtml(p){
  var s='<p class="lead">The essay is marked out of 10 against one question: does the student provide a clear, coherent and critical exploration of the essay title? Examiners read the three strands together and choose the band that best fits the whole essay.</p>'+RUB;
  if(p){s+="<h3>How to hit each strand on Prompt "+p.n+'</h3><div class="grid"><div class="card tint s-claim"><h3>Focus and areas of knowledge</h3><p>'+p.tips[0]+'</p></div><div class="card tint s-ex"><h3>Arguments, examples, implications</h3><p>'+p.tips[1]+'</p></div><div class="card tint s-ctr"><h3>Points of view</h3><p>'+p.tips[2]+"</p></div></div>"}
  return s;
}
function chkGroups(p){return[
{h:"Focus and areas of knowledge",s:"--r-claim",i:["I define the key terms and use the meanings consistently.","Every paragraph answers the title, not only the introduction.","Each area is linked to the title through its methods, sources or practices.",p.chk]},
{h:"Arguments, examples and implications",s:"--r-ex",i:["Each claim paragraph has a claim, a specific example, an explanation, a link and an implication.","Each example is named, dated and accurate, and I explain only what I can defend.","I analyse instead of describing."]},
{h:"Points of view",s:"--r-ctr",i:["Each area has a counterclaim based on a real example.","I evaluate each counterclaim: it survives, needs a qualification, or is rejected, with a reason.","I end each area with a mini-conclusion.","My conclusion answers the title, draws the areas together and adds no new examples."]},
{h:"Form",s:"--c-math",i:["The essay is 1,600 words or fewer.","Sources are acknowledged and in-text citations are used consistently.","The essay is my own work."]}]}

function casesHtml(p){
  var n=0;p.cases.forEach(function(a){n+=a.x.length});
  var o='<p class="lead">Pick two cases per area: one for your claim paragraph and one for your counterclaim. Each card shows what the case offers and a limit you can use. Check dates and details in a reliable source before you use any example, and explain only what you can defend.</p>';
  o+='<div class="note" role="note"><b>This is AI generated. Double check your work!</b> Verify every name, date and detail in a reliable source before you use any example.<br><b>You can most definitely use other examples!</b> Think about your subject areas and the examples you have learned over the past year.</div>';
  o+='<div class="tabs" role="tablist" aria-label="Areas of knowledge" id="tabs"></div><div id="panels"></div>';
  return{html:o,n:n};
}
function buildTabs(p){
  var tabs=$("tabs"),panels=$("panels");if(!tabs)return;
  p.cases.forEach(function(a,ai){
    var b=document.createElement("button");b.type="button";b.className="k-"+a.k;b.id="tab-"+a.k;b.setAttribute("role","tab");b.setAttribute("aria-controls","panel-"+a.k);b.setAttribute("aria-selected",ai==0?"true":"false");b.textContent=a.h+" ("+a.x.length+")";
    b.onclick=function(){showTab(p,a.k)};tabs.appendChild(b);
    var d=document.createElement("div");d.className="panel k-"+a.k;d.id="panel-"+a.k;d.setAttribute("role","tabpanel");d.setAttribute("aria-labelledby","tab-"+a.k);d.hidden=ai!=0;
    d.innerHTML='<div class="grid">'+a.x.map(function(e,i){return'<article class="ex"><h3><span class="no">'+(i+1)+"</span>"+esc(e[0])+"</h3><p><b>"+p.lab[0]+":</b> "+esc(e[1])+"</p><p><b>"+p.lab[1]+":</b> "+esc(e[2])+"</p><p><b>"+p.lab[2]+":</b> "+esc(e[3])+"</p><p><b>"+p.lab[3]+":</b> "+esc(e[4])+"</p></article>"}).join("")+"</div>";
    panels.appendChild(d);
  });
}
function showTab(p,k){p.cases.forEach(function(a){var on=a.k==k;$("tab-"+a.k).setAttribute("aria-selected",on?"true":"false");$("panel-"+a.k).hidden=!on})}

/* ---------------- pages ---------------- */
function homePage(){
  var o='<header class="hero" style="--pc:#4f46e5"><div class="wrap"><div class="stripe" aria-hidden="true"><i style="background:#a78bfa"></i><i style="background:#f59e0b"></i><i style="background:#f472b6"></i><i style="background:#4ade80"></i><i style="background:#60a5fa"></i></div><div class="hrow"><h1>TOK Essay Guides</h1>'+DISC+'</div><p class="q">One page for each of the six prescribed titles, May 2027 session.</p><p class="meta">1,600 words maximum · IB Theory of Knowledge</p><div class="job"><b>How to use this site:</b> choose your title, read its page from top to bottom, then plan your paragraphs with the recipes and cases. Every page ends with the rubric and a tick-list. Nothing here is written for you: you decide what to argue.</div></div></header><main class="wrap">';
  o+=sec("start","Start here","--r-int",'<p class="lead">Watch this overview of the May 2027 essay before you choose a title.</p>'+vidHtml("NsqwwYZvQOA")+'<p class="ref"><b>Reference:</b> TOK Today. “How to Smash ToK Essay May 27”. YouTube video. https://www.youtube.com/watch?v=NsqwwYZvQOA (accessed 9 November 2026).</p>');
  o+='<section id="titles" style="--s:var(--p1)"><h2>Choose your title</h2><div class="grid">';
  P.forEach(function(p){
    var ar=p.id==="p1"?["The arts","History"]:p.id==="p3"?["Human sciences + 1"]:p.id==="p4"?["Mathematics + 1"]:p.id==="p6"?["Natural sciences + 1"]:["Any two areas"];
    o+='<a class="pcard q'+p.n+'" href="#'+p.id+'" data-r="'+p.id+'"><span class="num">Prompt '+p.n+'</span><h3>'+esc(p.short)+'</h3><p>'+esc(p.q)+'</p><span class="areas">'+ar.map(function(x){return"<span>"+x+"</span>"}).join("")+'</span><span class="go">Open the guide →</span></a>';
  });
  o+="</div></section>";
  o+='<section id="every" style="--s:var(--r-ex)"><h2>On every page</h2><div class="grid"><div class="card tint s-claim"><h3>The big idea</h3><p>Four steps that turn the title into a line of argument.</p></div><div class="card tint s-exp"><h3>Key terms</h3><p>What each phrase in the title asks of you.</p></div><div class="card tint s-ex"><h3>Essay map</h3><p>The 1,600-word split across introduction, two areas and conclusion.</p></div><div class="card tint s-link"><h3>Paragraph recipes</h3><p>What goes into each paragraph, part by part, with sentence starters.</p></div><div class="card tint s-int"><h3>Cases</h3><p>Real examples by area of knowledge, each with a limit for your counterclaim.</p></div><div class="card tint s-ctr"><h3>Traps and checklist</h3><p>Common mistakes, then a tick-list that saves your progress in this browser.</p></div></div></section>';
  o+=sec("rubric","The assessment rubric","--c-nat",rubricHtml(null));
  o+="</main>";
  o+='<footer class="wrap"><p>Video: TOK Today, YouTube, https://www.youtube.com/watch?v=NsqwwYZvQOA (accessed 9 November 2026). Title notes draw on RevisionDojo’s M27 breakdown notes. The structure and word split follow Clastify’s guide to TOK essay format and structure. The rubric is the IB assessment instrument for the TOK essay. This is an unofficial study aid and is not endorsed by the IB. Check the exact wording of each title against the official IB prescribed titles sheet.</p></footer>';
  return{html:o,jumps:[["start","Video","--r-int"],["titles","Titles","--p1"],["every","On every page","--r-ex"],["rubric","Rubric","--c-nat"]]};
}

function promptPage(p){
  var cs=casesHtml(p),jumps=[["idea","Big idea","--r-claim"],["video","Video","--r-int"],["terms","Key terms","--r-exp"]];
  var o='<header class="hero" style="--pc:var(--p'+p.n+')"><div class="wrap"><div class="stripe" aria-hidden="true"><i style="background:#a78bfa"></i><i style="background:#f59e0b"></i><i style="background:#f472b6"></i><i style="background:#4ade80"></i><i style="background:#60a5fa"></i></div><div class="hrow"><h1>Prompt '+p.n+": "+esc(p.short)+'</h1>'+DISC+'</div><p class="q">'+esc(p.q)+'</p><p class="meta">'+esc(p.meta)+'</p><div class="job"><b>Your job in one sentence:</b> '+esc(p.job)+"</div></div></header><main class=\"wrap\">";
  o+=sec("idea","The big idea","--r-claim",'<div class="steps">'+p.idea.map(function(c){return'<div class="card tint step s-'+c[2]+'"><h3>'+c[0]+"</h3><p>"+c[1]+"</p></div>"}).join("")+'</div><div class="note"><b>Keep in mind:</b> '+p.note+"</div>");
  o+=sec("video","Watch first","--r-int",'<p class="lead">Watch this video before you start planning. Pause it when you hear an idea you could use, and note which area of knowledge it fits.</p>'+vidHtml(p.vid)+'<p class="ref"><b>Reference:</b> TOK Today. YouTube video. https://www.youtube.com/watch?v='+p.vid+' (accessed 9 November 2026).</p>');
  o+=sec("terms","Unpack the key terms","--r-exp",cards(p.terms));
  p.extra.forEach(function(e){
    var h=e.html.replace("__ORIG__",ORIG);
    o+=sec(e.id,e.t,e.h,h);jumps.push([e.id,e.t,e.h]);
  });
  o+=sec("map","Your essay map","--r-ex",mapBar(p));
  o+=sec("paras","What goes inside each paragraph","--r-link",paras(p));
  o+=sec("pairs",p.pairsTitle,"--c-math",pairsHtml(p));
  o+=sec("cases",cs.n+" cases to draw on","--c-hum",cs.html);
  o+=sec("traps","Traps to avoid","--r-ctr",trapsHtml(p));
  o+=sec("rubric","The assessment rubric","--c-nat",rubricHtml(p));
  o+=sec("check","Final check","--c-arts",'<p class="lead">Tick an item only when you can point to the sentence that does it. Your ticks are saved in this browser.</p><div class="prog" aria-hidden="true"><i id="pbar"></i></div><p><b id="ptxt">0 of 0 done</b></p><div class="grid" id="checks"></div>');
  o+="</main>";
  var nx=P[p.n%6],pv=P[(p.n+4)%6];
  o+='<footer class="wrap"><p><a href="#'+pv.id+'" data-r="'+pv.id+'">← Prompt '+pv.n+'</a> · <a href="#home" data-r="home">All titles</a> · <a href="#'+nx.id+'" data-r="'+nx.id+'">Prompt '+nx.n+' →</a></p><p style="margin-top:10px">'+(p.id==="p2"?"Video: YouTube, https://www.youtube.com/watch?v=L-udmzgZVas (accessed 9 November 2026). ":"")+'Title notes draw on RevisionDojo’s M27 breakdown notes. The structure and word split follow Clastify’s guide to TOK essay format and structure. The rubric is the IB assessment instrument for the TOK essay. This is an unofficial study aid and is not endorsed by the IB. Check the exact wording of the title against the official IB prescribed titles sheet.</p></footer>';
  jumps=jumps.concat([["map","Map","--r-ex"],["paras","Paragraphs","--r-link"],["pairs","Areas","--c-math"],["cases","Cases","--c-hum"],["traps","Traps","--r-ctr"],["rubric","Rubric","--c-nat"],["check","Checklist","--c-arts"]]);
  return{html:o,jumps:jumps};
}

function buildChecks(p){
  var cs=$("checks");if(!cs)return;
  var key="tokg-"+p.id,saved={};
  try{saved=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch(e){saved={}}
  chkGroups(p).forEach(function(g,gi){
    var d=document.createElement("div");d.className="card tint";d.style.setProperty("--s","var("+g.s+")");
    d.innerHTML="<h3>"+g.h+"</h3>"+g.i.map(function(x,ii){var id="c"+gi+"_"+ii;return'<label class="chk" for="'+id+'"><input type="checkbox" id="'+id+'"'+(saved[id]?" checked":"")+"><span>"+esc(x)+"</span></label>"}).join("");
    cs.appendChild(d);
  });
  function prog(){var all=cs.querySelectorAll("input"),n=0,st={};for(var i=0;i<all.length;i++){if(all[i].checked){n++;st[all[i].id]=1}}
    $("pbar").style.width=(100*n/all.length)+"%";$("ptxt").textContent=n+" of "+all.length+" done";
    try{localStorage.setItem(key,JSON.stringify(st))}catch(e){}}
  cs.addEventListener("change",prog);prog();
}

/* ---------------- shell and routing ---------------- */
function siteBar(cur){
  var o='<a href="#home" data-r="home" style="--s:var(--ink)"'+(cur==="home"?' aria-current="page"':"")+">Home</a>";
  P.forEach(function(p){o+='<a href="#'+p.id+'" data-r="'+p.id+'" style="--s:var(--p'+p.n+')"'+(cur===p.id?' aria-current="page"':"")+">Prompt "+p.n+"</a>"});
  $("rowSite").innerHTML=o;
}
function jumpBar(j){
  var r=$("rowJump");
  r.innerHTML=j.map(function(x){return'<button type="button" data-go="'+x[0]+'" style="--s:var('+x[2]+')">'+x[1]+"</button>"}).join("");
  r.hidden=false;
}
function render(id){
  var p=null;P.forEach(function(q){if(q.id===id)p=q});
  var pg=p?promptPage(p):homePage();
  document.title=p?"TOK Prompt "+p.n+" Guide":"TOK Essay Guides May 2027";
  $("app").innerHTML=pg.html;
  siteBar(p?p.id:"home");jumpBar(pg.jumps);
  if(p){buildTabs(p);buildChecks(p)}
  window.scrollTo(0,0);
}
function cur(){var h="";try{h=(location.hash||"").replace("#","")}catch(e){}
  if(!/^[a-z0-9-]+$/.test(h))return"home";return h}
document.addEventListener("click",function(e){
  var t=e.target;
  while(t&&t!==document&&!(t.getAttribute&&(t.getAttribute("data-r")||t.getAttribute("data-go"))))t=t.parentNode;
  if(!t||t===document)return;
  var r=t.getAttribute("data-r"),g=t.getAttribute("data-go");
  if(r){e.preventDefault();try{history.replaceState(null,"","#"+r)}catch(x){}render(r)}
  else if(g){var el=$(g);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}
});
window.addEventListener("hashchange",function(){render(cur())});
render(cur());
</script>

</body>
</html>
